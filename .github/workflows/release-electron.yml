name: Release Electron App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Trigger on version tags like v0.1.0, v1.0.0, etc.

jobs:
  release:
    name: Build and Release Electron
    runs-on: windows-latest
    
    permissions:
      contents: write # Required for electron-builder to create a GitHub Release and upload assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js and Release Electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_API_URL: https://tijaratpro-api-598374253827.asia-south1.run.app
        run: npm run release

